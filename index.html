  function login() {

        if (error) throw error;

  };
  // Posisi pemain lewat Broadcast (bukan Presence): lebih tahan untuk update cepat
  function room() {
    const key = uid + '_' + Math.random().toString(36).slice(2, 6);
    let st = {}, fn = null, joined = false, last = 0, pend = false, tp = 0;
    const seen = new Map();
    const ch = sb.channel('desa', { config: { broadcast: { self: false } } });
    const peers = () => { const t = Date.now(), a = []; seen.forEach((v, k) => { if (t - v.t > 7000) seen.delete(k); else a.push({ peer: k, isMe: false, presence: v.p }); }); return a; };
    const emit = () => fn && fn({ peers: peers() });
    const send = () => { last = Date.now(); if (joined && st.n !== undefined) ch.send({ type: 'broadcast', event: 'p', payload: Object.assign({}, st, { k: key }) }); };
    ch.on('broadcast', { event: 'p' }, m => {
      const p = m.payload; if (!p || !p.k || p.k == key) return;
      if (!p.n) seen.delete(p.k); else seen.set(p.k, { t: Date.now(), p });
      if (!pend) { pend = true; setTimeout(() => { pend = false; emit(); }, 120); }
    }).subscribe(s => { if (s == 'SUBSCRIBED') { joined = true; send(); } });

      if (n == 'user') return usr;
      if (n == 'room') return RMX || (RMX = room());
    }
  };
})();

const FZ={s:['Kecil','🐟',5],m:['Sedang','🐠',12],l:['Besar','🐡',25],x:['Raksasa','🦈',60]};
const fd=()=>{const d=td();if(!S.fs||S.fs.d!=d)S.fs={d,n:0};if(!S.fb)S.fb={s:0,m:0,l:0,x:0,j:0};return S.fs};
const fbTot=()=>Object.keys(FZ).reduce((a,k)=>a+S.fb[k]*FZ[k][2],0)+S.fb.j;
function fishUI(){const f=fd(),b=S.fb,tot=fbTot();return `<h3>🎣 Memancing</h3><div class=cd><div><b>Tangkapan hari ini: ${f.n}/30</b><div class=bar><i style='width:${f.n/30*100}%'></i></div></div>${f.n>=30?'<small>Batas harian tercapai</small>':`<button data-a=cast>🎣 Lempar Kail</button>`}</div><div class=cd><div><b>Keranjang ikan</b><small>${Object.keys(FZ).map(k=>FZ[k][1]+' '+FZ[k][0]+' x'+b[k]+' ('+FZ[k][2]+')').join(' · ')}</small><small>🥫 Sampah x${b.j} (1 koin, ikut membersihkan sungai)</small></div><button data-a=sellf ${tot?'':'disabled'}>Tukar 🪙${tot}</button></div>`}

/* --- musik ceria: tempo 104 bpm, bass, petikan, melodi marimba, kick dan hi-hat --- */
music=function(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();const cmp=AC.createDynamicsCompressor();MG=AC.createGain();MG.gain.value=mon?.16:0;MG.connect(cmp);cmp.connect(AC.destination);
 const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

 const tone=(m,t,du,ty,v)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f(m);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g);g.connect(MG);o.start(t);o.stop(t+du+.05)};
 const kick=t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);g.gain.setValueAtTime(.45,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);o.connect(g);g.connect(MG);o.start(t);o.stop(t+.2)};
 const hat=(t,v)=>{const s=AC.createBufferSource(),h=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;h.type='highpass';h.frequency.value=7000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.05);s.connect(h);h.connect(g);g.connect(MG);s.start(t);s.stop(t+.06)};
 const CH=[[48,[60,64,67]],[43,[59,62,67]],[45,[57,60,64]],[41,[57,60,65]]],MOT=[[72,0,76,0,79,0,76,72,0,74,0,76,0,0,72,0],[79,0,0,76,79,0,81,0,79,76,0,72,74,0,0,0],[76,0,74,72,0,74,76,0,79,0,76,0,74,72,0,0],[72,74,76,79,0,81,79,0,76,0,74,76,72,0,0,0]];
 let st=0,nx=AC.currentTime+.1,mo=MOT[0];
 const step=t=>{const b=Math.floor(st/16)%4,s=st%16,c=CH[b];if(s==0)mo=MOT[Math.floor(Math.random()*4)];
  if([0,6,8,14].includes(s))tone(c[0]+(s==6||s==14?12:0),t,.28,'triangle',.28);
  if([2,6,10,14].includes(s))c[1].forEach(m=>tone(m,t,.16,'triangle',.06));
